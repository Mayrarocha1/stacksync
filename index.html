<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackSync Pro | Optimizador Circadiano de Suplementos</title>
  <link rel="icon" type="image/jpeg" href="Icon.jpg">
  <link rel="apple-touch-icon" href="Icon.jpg">
  <link rel="manifest" href="manifest.json">
  <!-- Configuración App Móvil (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StackSync">
  <meta name="theme-color" content="#059669">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print {
      body { background: white !important; color: black !important; }
      header, #panel-catalogo, #pwa-banner, #modal-pro, button { display: none !important; }
      #cronograma-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .bloque-print { break-inside: avoid; border: 1px solid #e2e8f0 !important; margin-bottom: 12px !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Encabezado Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-capsules text-base"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight text-slate-900 leading-none">StackSync <span class="text-emerald-600">Pro</span></h1>
          <p class="text-[10px] text-slate-600 font-medium tracking-wide">Optimizador Circadiano de Suplementos</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-badge-pro" onclick="abrirModalPro()" class="text-xs font-bold px-3 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-lg shadow-xs hover:opacity-95 transition flex items-center gap-1.5">
          <i class="fa-solid fa-crown text-[11px]"></i>
          <span id="txt-badge-pro">Obtener Pro</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner PWA Informativo -->
  <div id="pwa-banner" class="bg-emerald-900 text-white text-[11px] py-1.5 px-4 text-center font-medium flex items-center justify-center gap-2">
    <span>💡 Instala StackSync en tu celular: Menú de Chrome (⋮) → Instalar o Agregar a Inicio</span>
  </div>

  <!-- Contenedor Principal de Dos Columnas -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 w-full">

    <!-- Panel Izquierdo: Catálogo y Filtros -->
    <section id="panel-catalogo" class="lg:col-span-5 bg-white border border-slate-200 rounded-2xl shadow-xs flex flex-col h-[650px] lg:h-[82vh] overflow-hidden">
      <!-- Buscador y Filtros -->
      <div class="p-3 border-b border-slate-100 space-y-2.5 bg-white z-10">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-xs uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
            <i class="fa-solid fa-layer-group text-emerald-600"></i> Catálogo Clínico
          </h2>
          <button onclick="limpiarSeleccion()" class="text-[11px] text-rose-500 hover:text-rose-600 font-semibold transition">Limpiar todo</button>
        </div>

        <!-- Buscador -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="buscador" oninput="filtrarSuplementos()" placeholder="Buscar: Zinc, Bambú, NAD+, Vitamina D..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
        </div>

        <!-- Filtro por Categorías -->
        <div class="flex gap-1.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
          <button onclick="filtrarCategoria('todas')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-900 text-white font-medium shadow-xs" data-cat="todas">Todos (200+)</button>
          <button onclick="filtrarCategoria('mitocondria')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="mitocondria">Longevidad / NAD+</button>
          <button onclick="filtrarCategoria('minerales')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="minerales">Minerales</button>
          <button onclick="filtrarCategoria('estructural')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="estructural">Bambú & Articular</button>
          <button onclick="filtrarCategoria('vitaminas')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="vitaminas">Vitaminas</button>
          <button onclick="filtrarCategoria('adaptogenos')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="adaptogenos">Adaptógenos</button>
          <button onclick="filtrarCategoria('aminoacidos')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="aminoacidos">Aminoácidos</button>
          <button onclick="filtrarCategoria('digestivos')" class="cat-btn whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200" data-cat="digestivos">Digestión & Microbiota</button>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-0.5">
          <span id="contador-seleccion" class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200/50">0 seleccionados</span>
          <span id="
